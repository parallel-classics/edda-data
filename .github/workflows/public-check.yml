name: public check

# Nothing private goes into this repository: secrets, personal data, private notes, paths of somebody's computer.
# The same script runs locally as a git hook (.githooks/); this run covers contributors who do not have the hooks.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: gitleaks (pinned, checksum verified)
        run: |
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/bin" && tar -xzf gitleaks.tar.gz -C "$HOME/bin" gitleaks && rm gitleaks.tar.gz
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: the tree
        run: python -I scripts/check_public.py
      - name: the commits of this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -I scripts/check_public.py --range "$BASE..$HEAD"
      - name: validator
        run: python -I scripts/validate.py
